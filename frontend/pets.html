    <main>
        <div class="container">            
            <section id="pet-showcase">
                <h1>Pets Showcase</h1>
            </section>
            <div id="card-container" class="flex-container"></div>

            <template id="card-template">
                <article class="pet-card">
                    <header>
                        <h3 class="card-name" style="color:white; margin-bottom: 0px;"></h3>
                    </header>
                    <div class="card-body">
                        <img class="card-image" src="" loading="lazy">
                        <hr/>
                        <p class="card-age"></p>
                        <p class="card-breed"></p>
                        <p class="card-description"></p>
                    </div>
                    <footer>
                        <button class="open-panel-btn">More Info</button>
                        <a href="#" class="meet-btn-link">
							<button class="meet-btn">Meet</button>
						</a>
                    </footer>
                </article>
            </template>

        </div>

        <div class="container">            
            <section id="adoptions">
                <h1>Sucessful Adoptions</h1>
            </section>
            <div id="card-container-2" class="flex-container"></div>

        </div>


    </main>

    <div id="side-panel" class="side-panel">
        <div class="panel-top"> 
            <h2 id="panel-name"></h2>
            <button id="close-btn">X</button>
        </div>
        <img id="panel-image" src="">
        <hr/>
        <div class="panel-info">
            <p id="panel-breed"></p>
            <p id="panel-color"></p>
            <p id="panel-sex"></p>
            <p id="panel-neutered"></p>
            <p id="panel-dob"></p>
            <p id="panel-vax1"></p>
            <p id="panel-vax2"></p>
            <p id="panel-rabies"></p>
            <p id="panel-microchip"></p>
            <p id="panel-passport"></p>
            <p id="panel-cattest"></p>
            <p id="panel-dogtest"></p>
            <p id="panel-childtest"></p>
            <p id="panel-bio"></p>
            <!-- <button id="panel-category">Available</button> -->

        </div>
